#
# ADVi3++ Firmware
# PlatformIO Configuration File
#

[advi3pp]
platform            = atmelavr
board               = megaatmega2560
build_flags         = ${common.build_flags} -std=gnu++1z -Wl,--relax -Werror
build_unflags       = -std=gnu++11
board_build.f_cpu   = 16000000L
src_filter          = ${common.default_src_filter} +<src/HAL/AVR>

upload_protocol     = custom
upload_port         = /dev/cu.usbmodem233101
upload_speed        = 115200
upload_kind         = usb
upload_flags =
    -v
    -D
    -V
    -C${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -p$BOARD_MCU
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
    -cwiring
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i

# For Windows, use something like:
#upload_port  = COM5
#upload_flags =
#  -D
#  -V
#  -C${platformio.packages_dir}/tool-avrdude/avrdude.conf
#  -p$BOARD_MCU
#  -P$UPLOAD_PORT
#  -b$UPLOAD_SPEED
#  -cwiring

[env:advi3pp_51]
extends             = advi3pp
build_flags         = ${advi3pp.build_flags} -DADVi3PP_51 -DNDEBUG

[env:advi3pp_51_bltouch]
extends             = advi3pp
build_flags         = ${advi3pp.build_flags} -DADVi3PP_51 -DBLTOUCH -DNDEBUG

[env:advi3pp_52c]
extends             = advi3pp
build_flags         = ${advi3pp.build_flags} -DADVi3PP_52C -DNDEBUG

[env:advi3pp_52c_bltouch]
extends             = advi3pp
build_flags         = ${advi3pp.build_flags} -DADVi3PP_52C -DBLTOUCH -DNDEBUG

[env:advi3pp_54]
extends             = advi3pp
build_flags         = ${advi3pp.build_flags} -DADVi3PP_54 -DNDEBUG

[env:advi3pp_54_bltouch]
extends             = advi3pp
build_flags         = ${advi3pp.build_flags} -DADVi3PP_54 -DBLTOUCH -DNDEBUG

[env:advi3pp_hw_simulator]
extends             = advi3pp
build_flags         = ${advi3pp.build_flags} -DADVi3PP_52C -DBLTOUCH -DADVi3PP_DEBUG -DADVi3PP_HARDWARE_SIMULATOR

#
# Native Simulation
#

[advi3pp_simulator]
platform          = native
framework         =
build_flags       =
    ${common.build_flags}
    -std=gnu++17
    -IMarlin
    -IMarlin/src/HAL/NATIVE_SIM/u8g
    -D__PLAT_NATIVE_SIM__
    -DU8G_HAL_LINKS
    -DGLM_ENABLE_EXPERIMENTAL
lib_compat_mode   = off
build_src_filter  = ${common.default_src_filter} +<src/HAL/NATIVE_SIM>
lib_deps          = ${common.lib_deps}
                    MarlinSimUI=file://./MarlinSimUI/
                    Adafruit NeoPixel=https://github.com/p3p/Adafruit_NeoPixel/archive/c6b319f447.zip
                    LiquidCrystal=https://github.com/p3p/LiquidCrystal/archive/322fb5fc23.zip
extra_scripts     = ${common.extra_scripts}
                    pre:buildroot/share/PlatformIO/scripts/simulator.py

#
# Simulator for macOS
#
# Use the script buildroot/bin/mac_gcc to prepare your environment.
#
# Homebrew:
#  /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
#
#  brew install gcc@14 glm mesa sdl2 sdl2_net
#
#  cd "$(brew --prefix)/bin"
#  rm -f gcc g++ cc
#  ln -s gcc-14 gcc ; sudo ln -s g++-14 g++ ; sudo ln -s g++ cc
#  cd -
#

[advi3pp_macos_arm64]
build_unflags     = -g2 -g3 -lGL -fstack-protector-strong
build_flags       =
    -mmacosx-version-min=10.13
    -DMACOSX_DEPLOYMENT_TARGET=10.13
    -DHAS_LIBBSD
    -I/opt/homebrew/include/
    -I/opt/homebrew/include/c++/14/
    -I/opt/homebrew/include/c++/14/aarch-apple-darwin24/
    -I/opt/homebrew/include/SDL2/
    -L/opt/homebrew/lib/
    -Wl,-framework,OpenGL
    -Wl,-framework,CoreFoundation
    -fno-stack-protector

[env:advi3pp_macos]
extends         = advi3pp_simulator
build_type      = debug
build_flags     =
    ${advi3pp_simulator.build_flags}
    ${advi3pp_macos_arm64.build_flags}
    -g2
    -ggdb
    -Og
    -D_THREAD_SAFE
    -DADVi3PP_DEBUG
build_unflags   = ${advi3pp_macos_arm64.build_unflags}
debug_tool = lldb
